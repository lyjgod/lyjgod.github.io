<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>"饼"不可少奖章</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #8B4513 0%, #D2691E 50%, #CD853F 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .title {
            color: #FFEFD5;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            font-family: 'Comic Sans MS', cursive, sans-serif;
        }

        .badge-container {
            perspective: 1000px;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 300px; /* 固定高度防止位置偏移 */
        }

        .badge {
            width: 280px;
            height: 280px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.4, 0.0, 0.2, 1);
            cursor: pointer;
            transform-origin: 50% 50% 0; /* 明确指定3D旋转中心 */
        }

        .badge.flipped {
            transform: rotateY(180deg);
        }

        .badge-face {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            transform-origin: 50% 50% 0; /* 确保面板也有正确的旋转中心 */
        }

        /* 饼干正面 - 更真实的饼干外观 */
        .badge-front {
            background: 
                /* 巧克力豆 */
                radial-gradient(circle at 25% 25%, #654321 8px, transparent 8px),
                radial-gradient(circle at 70% 30%, #8B4513 6px, transparent 6px),
                radial-gradient(circle at 45% 60%, #654321 7px, transparent 7px),
                radial-gradient(circle at 75% 75%, #8B4513 5px, transparent 5px),
                radial-gradient(circle at 20% 70%, #654321 6px, transparent 6px),
                radial-gradient(circle at 60% 80%, #8B4513 7px, transparent 7px),
                /* 饼干底色 */
                radial-gradient(ellipse at center, #DEB887 60%, #D2B48C 80%, #CD853F 100%);
            border-radius: 45% 55% 50% 50% / 50% 45% 55% 50%;
            border: 8px solid #B8860B;
            position: relative;
        }

        /* 饼干边缘效果 */
        .badge-front::before {
            content: '';
            position: absolute;
            top: -8px;
            left: -8px;
            right: -8px;
            bottom: -8px;
            border-radius: 45% 55% 50% 50% / 50% 45% 55% 50%;
            background: linear-gradient(45deg, #CD853F, #D2B48C, #DEB887);
            z-index: -1;
            box-shadow: inset 0 0 20px rgba(139, 69, 19, 0.3);
        }

        /* 奖励背面 */
        .badge-back {
            background: linear-gradient(45deg, #32CD32, #98FB98, #90EE90);
            border-radius: 45% 55% 50% 50% / 50% 45% 55% 50%;
            border: 8px solid #228B22;
            transform: rotateY(180deg);
        }

        .badge-title {
            font-size: 20px;
            font-weight: bold;
            color: #8B4513;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.8);
            font-family: 'Comic Sans MS', cursive, sans-serif;
            z-index: 10;
            position: relative;
        }

        .badge-subtitle {
            font-size: 12px;
            color: #654321;
            margin-bottom: 10px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.6);
            z-index: 10;
            position: relative;
        }

        .badge-recipient {
            font-size: 16px;
            font-weight: bold;
            color: #8B0000;
            margin-bottom: 8px;
            text-shadow: 1px 1px 3px rgba(255,255,255,0.7);
            z-index: 10;
            position: relative;
        }

        .badge-reason {
            font-size: 10px;
            color: #654321;
            text-align: center;
            padding: 0 20px;
            line-height: 1.2;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.6);
            z-index: 10;
            position: relative;
        }

        .reward-title {
            font-size: 18px;
            font-weight: bold;
            color: #FFFFFF;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 10;
            position: relative;
        }

        .reward-text {
            font-size: 14px;
            color: #FFFFFF;
            text-align: center;
            padding: 0 20px;
            line-height: 1.4;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
            z-index: 10;
            position: relative;
        }

        .instruction {
            color: #FFEFD5;
            font-size: 16px;
            margin-top: 20px;
            opacity: 0.9;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        /* 飘浮的饼干屑 */
        .crumb {
            position: absolute;
            font-size: 14px;
            animation: float 4s ease-in-out infinite;
            z-index: 5;
        }

        @keyframes float {
            0%, 100% { 
                opacity: 0.7; 
                transform: translateY(0px) rotate(0deg) scale(0.8); 
            }
            50% { 
                opacity: 1; 
                transform: translateY(-8px) rotate(180deg) scale(1.1); 
            }
        }

        .crumb:nth-child(1) { 
            top: -10%; 
            left: 10%; 
            animation-delay: 0s; 
            color: #D2691E;
        }
        .crumb:nth-child(2) { 
            top: -5%; 
            right: 15%; 
            animation-delay: 1s; 
            color: #CD853F;
        }
        .crumb:nth-child(3) { 
            bottom: -15%; 
            left: 20%; 
            animation-delay: 2s; 
            color: #D2691E;
        }
        .crumb:nth-child(4) { 
            bottom: -10%; 
            right: 10%; 
            animation-delay: 0.5s; 
            color: #CD853F;
        }

        @media (max-width: 480px) {
            .badge-container {
                height: 240px; /* 调整移动端容器高度 */
            }
            
            .badge {
                width: 220px;
                height: 220px;
            }
            
            .title {
                font-size: 24px;
            }
            
            .badge-title {
                font-size: 18px;
            }
            
            .badge-recipient {
                font-size: 14px;
            }
            
            .instruction {
                font-size: 14px;
            }
        }

        /* 移除可能导致位置偏移的active效果，改为JavaScript控制 */
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">"饼"不可少奖章 🍪</h1>
        
        <div class="badge-container">
            <div class="badge" id="badge" onclick="flipBadge()">
                <div class="crumb">🍪</div>
                <div class="crumb">🥠</div>
                <div class="crumb">🍪</div>
                <div class="crumb">🥠</div>
                
                <div class="badge-face badge-front">
                    <div class="badge-title">"饼"不可少奖章</div>
                    <div class="badge-subtitle">授予对象</div>
                    <div class="badge-recipient">饼饼</div>
                    <div class="badge-reason">
                        饼饼正确回答问题<br>
                        特此表彰
                    </div>
                </div>
                
                <div class="badge-face badge-back">
                    <div class="reward-title">🎉 成功解锁奖励 🎉</div>
                    <div class="reward-text">
                        一张由小猪颁发的<br>
                        <strong>🎫 愿望券 🎫</strong><br><br>
                        可实现一次愿望，请随时联系他兑换
                    </div>
                </div>
            </div>
        </div>
        
        <p class="instruction">点击饼干徽章查看奖励 🍪👆</p>
    </div>

    <script>
        let isFlipped = false;
        let isAnimating = false;

        function flipBadge() {
            if (isAnimating) return; // 防止动画期间重复点击
            
            const badge = document.getElementById('badge');
            isAnimating = true;
            isFlipped = !isFlipped;
            
            // 只使用CSS类控制旋转，不直接操作style.transform
            if (isFlipped) {
                badge.classList.add('flipped');
            } else {
                badge.classList.remove('flipped');
            }
            
            // 动画完成后重置状态
            setTimeout(() => {
                isAnimating = false;
            }, 800); // 与CSS transition时间一致
        }

        // 优化的事件处理
        const badge = document.getElementById('badge');
        let touchStartTime = 0;
        
        // 桌面端点击
        badge.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            flipBadge();
        });

        // 移动端触摸优化 - 简化版本，避免transform冲突
        badge.addEventListener('touchstart', function(e) {
            e.preventDefault();
            touchStartTime = Date.now();
            // 添加视觉反馈但不使用transform
            this.style.opacity = '0.8';
        });

        badge.addEventListener('touchend', function(e) {
            e.preventDefault();
            e.stopPropagation();
            
            // 恢复透明度
            this.style.opacity = '1';
            
            // 检查是否为有效点击（防止意外触发）
            const touchDuration = Date.now() - touchStartTime;
            if (touchDuration < 500) { // 500ms内的触摸认为是点击
                flipBadge();
            }
        });

        // 防止触摸取消时的问题
        badge.addEventListener('touchcancel', function(e) {
            this.style.opacity = '1';
        });

        // 防止页面缩放
        document.addEventListener('touchstart', function(e) {
            if (e.touches.length > 1) {
                e.preventDefault();
            }
        }, { passive: false });

        // 防止双击缩放
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>
</body>
</html>
